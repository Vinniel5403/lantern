[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.filesystem = littlefs
extra_scripts = pre:load_env.py
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
build_src_filter =
    +<*>
    -<relay_test_main.cpp>
    -<lcd_test_main.cpp>

[env:relay_test]
extends = env:esp32dev
build_src_filter =
    -<*>
    +<relay_controller.cpp>
    +<relay_test_main.cpp>

[env:lcd_test]
extends = env:esp32dev
build_src_filter =
    -<*>
    +<lcd_controller.cpp>
    +<lcd_test_main.cpp>
